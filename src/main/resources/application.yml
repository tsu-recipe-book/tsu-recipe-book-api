spring:
  application:
    name: recipe-book-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recipe_book}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_SHOW_SQL:true}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

  docker:
    compose:
      skip:
        in-tests: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

app:
  upload:
    upload-dir: ${UPLOAD_DIR:uploads}
    max-file-size: ${APP_MAX_FILE_SIZE:10485760}
    max-files-per-item: ${APP_MAX_FILES:5}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - webp
