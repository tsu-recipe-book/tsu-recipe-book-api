spring:
  application:
    name: recipe-book-api

  datasource:
    url: jdbc:postgresql://localhost:5432/recipe_book
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    path: /swagger-ui.html

server:
  port: 8080
  servlet:
    context-path: /api/v1

app:
  upload:
    upload-dir: uploads
    max-file-size: 10485760
    max-files-per-item: 5
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - webp
